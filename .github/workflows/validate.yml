name: LinkedIn Blitz validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Verify JavaScript syntax
        run: |
          node --check docs/app.js
          node --check scripts/build.mjs
          node --check tests/blitz.test.mjs
          node --check tests/browser.test.mjs
          node --check tests/bundle.test.mjs
          node --check scripts/check-published.mjs
          node --check scripts/build-firebase-demo.mjs
          node --check scripts/verify-firebase-demo.mjs
          node --check scripts/blitz-hosting-guard.mjs
          node --check tests/firebase.test.mjs
          node --check tests/firebase-deploy.test.mjs
          node --check tests/mobile-layout.test.mjs
          node --check tests/secure-shell.test.mjs
          node --check secure/shell.js
          node --check secure/envelope.mjs
          node --check secure/session.mjs
          node --check secure/auth-flow.mjs
          node --check secure/firestore-get.mjs
          node --check secure/wipe.mjs
          node --check secure/csp.mjs
          node --check secure/emulator-guard.mjs
          node --check secure/emulator-write.mjs
          node --check secure/synthetic-contacts.mjs
          node --check secure/private-view.mjs
          node --check scripts/build-secure-shell.mjs
          node --check scripts/verify-secure-shell.mjs
          node --check scripts/ingest-synthetic-emulator.mjs
          node --check scripts/run-secure-suite.mjs
          node --check scripts/secure-browser-check.mjs
          node --check tests/secure-live.integration.mjs
      - name: Run synthetic-only tests
        run: npm test
      - name: Verify committed encrypted GitHub Pages bundle
        run: npm run verify:bundle
      - name: Verify isolated Firebase demo staging output
        run: npm run verify:firebase-demo
      - name: Reuse compatible Chrome or Chromium; install only if missing
        run: |
          if ! node --input-type=module -e 'import { findChrome } from "./scripts/secure-browser-check.mjs"; await findChrome();'; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/chrome.deb || sudo apt-get install -y -f
          fi
          node --input-type=module -e 'import { findChrome } from "./scripts/secure-browser-check.mjs"; console.log(await findChrome());'
      - name: Run private shell emulator checks
        env:
          BLITZ_SECURE_ARTIFACTS: ${{ runner.temp }}/blitz-secure-artifacts
        run: npm run test:secure
