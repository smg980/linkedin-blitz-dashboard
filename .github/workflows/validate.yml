name: LinkedIn Blitz validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check docs/app.js
          node --check scripts/build.mjs
          node --check tests/blitz.test.mjs
      - name: Run synthetic-only tests
        run: npm test
